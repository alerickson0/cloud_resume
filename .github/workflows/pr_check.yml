name: PR check myVerification

# yamllint disable-line rule:truthy
on:
  workflow_dispatch:
    # branches: [ 'main' ]
    # types: [ ready_for_review, opened, reopened, synchronize ]

permissions:
  contents: read
  packages: read
  # To report GitHub Actions status checks
  statuses: write

jobs:
  linting:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          # The super-linter needs the full git history to get the
          # list of files that changed across commits
          fetch-depth: 0

      - name: Super-linter
        uses: super-linter/super-linter/slim@v8.7.0 # x-release-please-version
        env:
          # To report GitHub Actions status checks
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VALIDATE_JAVASCRIPT_PRETTIER: false
          VALIDATE_JAVASCRIPT_ES: false
          VALIDATE_TERRAFORM_TERRASCAN: false # Either the super-linter/Terrascan is not using my config file
          FIX_BIOME_FORMAT: true
          FIX_BIOME_LINT: true
          FIX_CSS: true

      - name: Commit and push linting fixes
        # Run only on:
        # - Pull requests
        # - Not on the default branch
        if: >
          github.event_name == 'pull_request' &&
          github.ref_name != github.event.repository.default_branch
        uses: stefanzweifel/git-auto-commit-action@v7.2.0
        with:
          branch: ${{ github.event.pull_request.head.ref || github.head_ref || github.ref }}
          commit_message: "chore: Fix linting issues"
          commit_user_name: super-linter
          commit_user_email: super-linter@super-linter.dev
